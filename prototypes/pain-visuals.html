<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Біль: варіанти</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;500&family=Tiny5&display=swap">
<style>
  /* Велика сцена від першої особи зліва, мініатюри всіх варіантів праворуч; на телефоні одне під одним. */
  :root {
    --bg: #161924; --panel: #20243a; --line: #3b4263; --fg: #ece3cf; --muted: #9aa0b8;
    --accent: #d4a03e; --light: #8fcf7e; --medium: #e9ac45; --strong: #df5b4f;
    --font: "Handjet", "Arial Narrow", ui-sans-serif, sans-serif;
    --font-display: "Tiny5", "Handjet", ui-sans-serif, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 19px/1.3 var(--font); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 32px; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
  h1 { margin: 0; font: 30px/1.1 var(--font-display); color: var(--accent); }
  .sub { color: var(--muted); font-size: 17px; max-width: 70ch; margin: 0; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .stage { background: #1e2230; border: 2px solid var(--line); padding: 12px; display: grid; gap: 10px; min-width: 0; }
  .stage canvas { width: 100%; height: auto; max-height: calc(100vh - 230px); object-fit: contain; image-rendering: pixelated; display: block; }
  .controls { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .controls label { font-size: 17px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .state { font: 18px/1 var(--font-display); padding: 3px 8px; color: #111; background: var(--c); white-space: nowrap; }
  .desc { margin: 0; font-size: 18px; min-height: 2.6em; }
  .desc b { color: var(--accent); font-weight: 500; }
  .thumbs { display: grid; gap: 10px; }
  .thumb {
    display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 10px; align-items: center;
    background: var(--panel); border: 2px solid var(--line); padding: 6px; cursor: pointer; text-align: left;
    font: inherit; color: inherit;
  }
  .thumb:hover { border-color: var(--muted); }
  .thumb[aria-pressed="true"] { border-color: var(--accent); }
  .thumb canvas { width: 120px; height: auto; image-rendering: pixelated; display: block; }
  .thumb span { font-size: 19px; }
  .thumb small { display: block; color: var(--muted); font-size: 15px; }
  kbd { font: inherit; font-size: 14px; background: #0f111a; border: 1px solid var(--line); padding: 0 5px; color: var(--muted); }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .thumbs { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .thumb { grid-template-columns: 1fr; }
    .thumb canvas { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Біль: варіанти</h1>
    <p class="sub">Вид від першої особи за комп’ютером. Посунь біль від 0 до 10 і подивись, що з цього читається як перевантаження, а не як картинка. Клавіші 1–8 перемикають варіант, стрілки змінюють біль.</p>
  </header>
  <div class="layout">
    <section class="stage">
      <canvas id="big" width="206" height="172" aria-label="Обраний варіант болю"></canvas>
      <div class="controls">
        <label for="pain">Біль</label>
        <input type="range" id="pain" min="0" max="10" step="1" value="6">
        <span class="state" id="state">6 · Помітний</span>
      </div>
      <p class="desc" id="desc"></p>
    </section>
    <nav class="thumbs" id="thumbs" aria-label="Варіанти"></nav>
  </div>
</div>

<script>
(function () {
  'use strict';
  const W = 206, H = 172;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16);
  const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  // ---------- фон: стіл, монітор, бриф на екрані ----------

  function makeBackground() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
    R(0, 0, W, H, '#2a504d');
    for (let y = 0; y < 128; y += 4) for (let x = (y / 4) % 2 ? 2 : 0; x < W; x += 4) R(x, y, 1, 1, '#2f5956');
    R(186, 10, 14, 30, '#171a22'); R(188, 12, 10, 26, '#c9c3a8');
    R(0, 126, W, H - 126, '#4f3222'); R(0, 126, W, 2, '#6e4630');
    for (let x = 0; x < W; x += 23) R(x, 130 + (x % 3), 14, 1, '#5a3926');
    R(20, 4, 166, 116, '#171a22'); R(22, 6, 162, 112, '#22262d'); R(26, 10, 154, 104, '#171a22');
    R(96, 118, 14, 8, '#22262d'); R(80, 124, 46, 4, '#22262d');
    R(48, 136, 110, 20, '#171a22'); R(50, 138, 106, 16, '#7d858f');
    for (let r = 0; r < 3; r++) for (let k = 0; k < 13; k++) R(52 + k * 8, 140 + r * 5, 6, 3, '#9aa2ac');
    R(166, 132, 14, 16, '#171a22'); R(167, 133, 12, 14, '#d4a03e'); R(179, 137, 3, 6, '#171a22');
    R(8, 100, 4, 28, '#33373f'); R(2, 92, 16, 9, '#d4a03e');
    // Екран: вікно з брифом і рядками тексту — щоб було видно, що саме біль заважає читати.
    R(30, 14, 146, 96, '#e9e4d6'); R(30, 14, 146, 6, '#3b4263');
    R(33, 16, 30, 2, '#ece3cf'); R(150, 16, 22, 2, '#ece3cf');
    const card = (x) => { R(x, 25, 42, 38, '#3b4263'); R(x + 1, 26, 40, 36, '#fbf8f0'); R(x + 1, 26, 40, 5, '#d9d4c6'); R(x + 3, 27, 14, 2, '#5a607a'); };
    card(36); card(82); card(128);
    for (let y = 0; y < 22; y++) { const w = y < 11 ? y : 21 - y; R(57 - w, 34 + y, w * 2 + 1, 1, y === 0 || y === 21 ? '#171a22' : '#c9c3b2'); R(57 - w, 34 + y, 1, 1, '#171a22'); R(57 + w, 34 + y, 1, 1, '#171a22'); }
    R(92, 35, 22, 22, '#171a22'); R(93, 36, 20, 20, '#3f7fd6');
    R(140, 42, 18, 5, '#171a22'); R(146, 36, 6, 17, '#171a22');
    const lines = [[36, 70, 120], [36, 76, 98], [36, 82, 132], [36, 88, 76]];
    for (const [x, y, w] of lines) { let cx = x; while (cx < x + w) { const ww = 6 + ((cx * 7) % 13); R(cx, y, Math.min(ww, x + w - cx), 2, '#7d8296'); cx += ww + 3; } }
    R(36, 97, 34, 8, '#3b4263'); R(38, 99, 20, 2, '#ece3cf');
    return g.getImageData(0, 0, W, H);
  }
  const BG = makeBackground();

  // ---------- малювання в буфер ----------

  function put(d, x, y, col, a) {
    x |= 0; y |= 0;
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) * 4;
    if (a == null || a >= 1) { d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2]; return; }
    d[i] += (col[0] - d[i]) * a; d[i + 1] += (col[1] - d[i + 1]) * a; d[i + 2] += (col[2] - d[i + 2]) * a;
  }
  const rect = (d, x, y, w, h, col) => { for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) put(d, xx, yy, col); };

  // ---------- Хвилі та їхні варіації ----------
  // Одна функція на всі хвилі: товщина, кольори, рвані «язики» краю й синусоїда вздовж кільця.
  const lerp3 = (a, b, f) => [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  function waves(d, t, i, o) {
    if (i <= 0) return;
    const sx = 103, sy = 184;                          // джерело — тіло, під нижнім краєм кадру
    const speed = (45 + 75 * i) * (o.speed || 1), period = (1.5 - 0.95 * i) * (o.period || 1);
    const th = o.thick(i);
    const rMax = 40 + 190 * i;
    const list = [];
    for (let k = Math.floor(t / period); k >= 0; k--) {
      const r = (t - k * period) * speed + 12;
      if (r > rMax) break;
      list.push({ r, k });
    }
    const core = 10 + 18 * i + Math.sin(t * (4 + 6 * i)) * (2 + 3 * i);
    const top = Math.max(0, sy - rMax - th - 30);
    const g = o.grid || 1;                             // крупніші «пікселі» для вогняного варіанта
    const tick = Math.floor(t * (o.flicker || 8));
    for (let y = top; y < H; y += g) for (let x = 0; x < W; x += g) {
      const cx = x + g / 2, cy = y + g / 2;
      const dd = Math.hypot(cx - sx, (cy - sy) * 1.15);
      const ang = Math.atan2(cy - sy, cx - sx);
      let col = null;
      if (dd < core) { if (dd < core - 2 || bay(x, y) < 0.5) col = o.core; }
      else for (const { r, k } of list) {
        let rr = r;
        // Сигнал: кільце коливається синусоїдою і ламається сходинками.
        if (o.wave) {
          const seg = Math.floor((ang + Math.PI) * 5);
          const jump = i > 0.3 ? (hash(seg + k * 13, Math.floor(t * (2 + 4 * i))) - 0.5) * Math.PI * 2 * (i - 0.3) : 0;
          rr += (2 + 9 * i) * Math.sin(ang * (8 + 10 * i) + t * (3 + 5 * i) + jump);
          rr = Math.round(rr / 2) * 2;
        }
        // Вогонь: зовнішній край рветься на язики, що мерехтять.
        let outer = th;
        if (o.tongues) outer += Math.floor(hash(Math.floor((ang + Math.PI) * (14 + 10 * i)) + k * 31, tick) * (4 + 16 * i) / 3) * 3;
        const kk = dd - (rr - th);
        if (kk < 0 || kk > th + outer) continue;
        const fade = (1 - r / rMax) * (0.55 + 0.45 * i);
        if (bay(x, y) > fade * (o.solid || 1.15)) continue;
        const f = kk / (th + outer);
        const atEdge = o.edgeOuter ? kk > th + outer - 1.5 : (kk > th + outer - 2 || kk < 1.5);
        col = o.edgeCol && atEdge ? o.edgeCol : lerp3(o.inCol, o.outCol, f);
        break;
      }
      if (col) for (let yy = 0; yy < g; yy++) for (let xx = 0; xx < g; xx++) put(d, x + xx, y + yy, col);
    }
  }
  const RED_IN = hex('#c93b3e'), RED_OUT = hex('#f0aeae'), RED_CORE = hex('#d94a4a');
  const rings = (d, t, i) => waves(d, t, i, { thick: (i) => 2.5 + 3.5 * i, inCol: RED_IN, outCol: RED_OUT, core: RED_CORE });
  // А. Між хвилями й вогнем: біло-сірий жар, рвані язики, крупні пікселі.
  const ashRings = (d, t, i) => waves(d, t, i, {
    thick: (i) => 3 + 4 * i, tongues: true, grid: 2, flicker: 9, solid: 1.3,
    inCol: hex('#fbfaf6'), outCol: hex('#8d8a84'), core: hex('#ffffff'), edgeCol: hex('#5e5b57'),
  });
  // Б. Ті самі хвилі, але товсті й важкі.
  const thickRings = (d, t, i) => waves(d, t, i, {
    thick: (i) => 6 + 11 * i, period: 1.25, speed: 0.85, solid: 1.25,
    inCol: RED_IN, outCol: RED_OUT, core: RED_CORE,
  });
  // В. Між хвилями й сигналом: кільця тремтять синусоїдою і ламаються.
  const signalRings = (d, t, i) => waves(d, t, i, {
    thick: (i) => 3.5 + 5 * i, wave: true, solid: 1.5, edgeOuter: true,
    inCol: hex('#1a1418'), outCol: hex('#4a2a30'), core: hex('#1a1418'), edgeCol: hex('#d23c40'),
  });

  // ---------- 2. Сигнал ----------
  const INK = hex('#111014'), INK_EDGE = hex('#c93b3e');
  function signal(d, t, i) {
    if (i <= 0) return;
    const waves = i > 0.6 ? 2 : 1;
    for (let w = 0; w < waves; w++) {
      const y0 = 148 - 46 * i - w * 34;
      const A = (3 + 28 * i) * (w ? 0.6 : 1), lam = 86 - 44 * i, ph = t * (2 + 5 * i) * (w ? -1.3 : 1);
      const seg = 34;
      for (let x = 0; x < W; x += 2) {
        // Розриви фази: хвиля ламається сходинками, як збій сигналу.
        const s = Math.floor(x / seg);
        const jump = i > 0.3 ? (hash(s + w * 99, Math.floor(t * (2 + 4 * i))) - 0.5) * Math.PI * 2 * (i - 0.3) : 0;
        let y = y0 - A * Math.sin((x / lam) * Math.PI * 2 + ph + jump);
        y = Math.round(y / 2) * 2;
        const a = Math.min(y, y0), b = Math.max(y, y0);
        for (let yy = a; yy <= b; yy++) { put(d, x, yy, INK); put(d, x + 1, yy, INK); }
        if (i > 0.5) { put(d, x, y, INK_EDGE); put(d, x + 1, y, INK_EDGE); }
      }
      if (i > 0.15) for (let x = 0; x < W; x += 3) put(d, x, Math.round(y0), INK);
    }
  }

  // ---------- 3. Вогонь ----------
  const F_RED = hex('#e2392b'), F_ORG = hex('#f08a2c'), F_YEL = hex('#f6d047');
  function flame(d, t, i) {
    if (i <= 0) return;
    const c = 5, spread = 26 + 120 * i, maxH = 14 + 118 * i, tick = Math.floor(t * (6 + 8 * i));
    for (let k = 0; k * c < W; k++) {
      const cx = k * c + c / 2;
      const e = Math.exp(-(((cx - 103) / spread) ** 2));
      const n = 0.55 + 0.45 * hash(k, tick);
      const h = Math.floor((maxH * e * n) / c) * c;
      if (h < c) continue;
      const ho = Math.floor((h * 0.62 * (e > 0.45 ? 1 : 0.5)) / c) * c;
      const hy = Math.floor((h * 0.34 * (e > 0.7 ? 1 : 0)) / c) * c;
      rect(d, k * c, H - h, c, h, F_RED);
      if (ho) rect(d, k * c, H - ho, c, ho, F_ORG);
      if (hy) rect(d, k * c, H - hy, c, hy, F_YEL);
    }
  }

  // ---------- 4. Чорний вогонь ----------
  const B_DARK = hex('#18171c'), B_MID = hex('#2c2b32'), B_HI = hex('#45434d');
  function blackFlame(d, t, i, st) {
    if (i <= 0) return;
    const c = 3, spread = 30 + 110 * i, maxH = 16 + 110 * i, tick = Math.floor(t * (2.5 + 3 * i));
    // Важке, повільне: повзе знизу й з кутів.
    const src = i > 0.5 ? [103, 0, W] : [103];
    for (let k = 0; k * c < W; k++) {
      const cx = k * c + 1;
      let e = 0;
      for (const sxx of src) e = Math.max(e, Math.exp(-(((cx - sxx) / (sxx === 103 ? spread : spread * 0.5)) ** 2)) * (sxx === 103 ? 1 : 0.8));
      const n = 0.6 + 0.4 * hash(k, tick);
      const h = Math.floor((maxH * e * n) / c) * c;
      for (let y = 0; y < h; y += c) {
        const top = h - y;
        if (top < 3 * c && hash(k * 7 + y, tick) < 0.45) continue;   // рвані клапті на краю
        const col = y < h * 0.45 && e > 0.6 ? (hash(k, y + tick) < 0.12 ? B_HI : B_MID) : B_DARK;
        rect(d, k * c, H - y - c, c, c, col);
      }
    }
    // Дим: клапті відриваються і повільно піднімаються.
    if (!st.wisps) st.wisps = [];
    const want = Math.floor(2 + 10 * i);
    while (st.wisps.length < want) st.wisps.push({ x: 103 + (Math.random() - 0.5) * spread * 1.6, y: H - maxH * (0.5 + Math.random() * 0.4), s: 1 + Math.floor(Math.random() * 3), v: 6 + Math.random() * 10, life: 1 });
    for (const w of st.wisps) {
      w.y -= w.v * st.dt; w.life -= st.dt * 0.35;
      for (let yy = 0; yy < w.s; yy++) for (let xx = 0; xx < w.s; xx++)
        if (bay(xx + (w.x | 0), yy + (w.y | 0)) < w.life) rect(d, Math.round(w.x / c) * c + xx * c, Math.round(w.y / c) * c + yy * c, c, c, B_DARK);
    }
    st.wisps = st.wisps.filter((w) => w.life > 0 && w.y > -10);
  }

  // ---------- 5. Шпилі ----------
  const S_INK = hex('#141317'), S_EDGE = hex('#b23037');
  function spikes(d, t, i, st) {
    if (i <= 0) return;
    if (!st.spikes) { st.spikes = []; st.next = 0; }
    // Прострілює раптово: частота й висота ростуть з болем.
    if (t >= st.next) {
      const side = i > 0.6 && Math.random() < 0.35 ? (Math.random() < 0.5 ? 'L' : 'R') : 'B';
      st.spikes.push({ born: t, side, pos: side === 'B' ? 103 + (Math.random() - 0.5) * (60 + 120 * i) : 30 + Math.random() * 110, h: (24 + 110 * i) * (0.6 + Math.random() * 0.4) });
      st.next = t + (1.6 - 1.3 * i) * (0.5 + Math.random());
    }
    const c = 4;
    for (const s of st.spikes) {
      const a = t - s.born;
      const k = a < 0.07 ? a / 0.07 : a < 0.27 ? 1 : Math.max(0, 1 - (a - 0.27) / 0.35);
      const h = Math.floor((s.h * k) / c) * c;
      for (let r = 0; r < h; r += c) {
        const half = Math.floor(((h - r) * 0.45) / c) * c;
        if (half < 0) continue;
        const edge = r + c >= h - c;
        if (s.side === 'B') rect(d, Math.round(s.pos / c) * c - half, H - r - c, half * 2 + c, c, edge ? S_EDGE : S_INK);
        else {
          const x0 = s.side === 'L' ? r : W - r - c;
          rect(d, x0, Math.round(s.pos / c) * c - half, c, half * 2 + c, edge ? S_EDGE : S_INK);
        }
      }
      // Удар: короткий здвиг кадру в момент прострілу.
      if (a < 0.08) st.shake = Math.max(st.shake || 0, 1 + Math.round(2 * i));
    }
    st.spikes = st.spikes.filter((s) => t - s.born < 0.7);
  }

  const VARIANTS = [
    { id: 'rings', name: 'Хвилі', note: 'Біль розходиться від тіла кільцями', fn: rings,
      desc: '<b>Хвилі.</b> Кільця розходяться від тіла знизу. Що сильніший біль, то частіші, ширші й вищі хвилі: при сильному вони накривають екран і ритмічно перебивають текст.' },
    { id: 'ash', name: 'Хвилі · попіл', note: 'Між хвилями й вогнем, біло-сіре', fn: ashRings,
      desc: '<b>Хвилі · попіл.</b> Ті самі кільця від тіла, але біло-сірі, як розпечене до білого, і з рваним краєм, що мерехтить язиками. Крупніші пікселі. Біль сліпить, а не червоніє.' },
    { id: 'thick', name: 'Хвилі · товсті', note: 'Як перший, але широкі й важкі', fn: thickRings,
      desc: '<b>Хвилі · товсті.</b> Перший варіант, тільки хвилі втричі ширші й трохи повільніші. Кожна хвиля — важкий удар, що на мить накриває великий шмат кадру.' },
    { id: 'sigrings', name: 'Хвилі · сигнал', note: 'Кільця тремтять синусоїдою', fn: signalRings,
      desc: '<b>Хвилі · сигнал.</b> Темні кільця з червоним краєм: розходяться від тіла, але тремтять синусоїдою й ламаються сходинками, як збитий сигнал. Що сильніший біль, то дрібніше й нервовіше тремтіння.' },
    { id: 'signal', name: 'Сигнал', note: 'Збита синусоїда, як осцилограф', fn: signal,
      desc: '<b>Сигнал.</b> Біль як шум у каналі: синусоїда піднімається знизу, амплітуда росте, хвиля ламається сходинками. При сильному болю дві хвилі йдуть назустріч одна одній.' },
    { id: 'flame', name: 'Вогонь', note: 'Пече знизу, росте й мерехтить', fn: flame,
      desc: '<b>Вогонь.</b> Ступінчасте полум’я з нижнього краю. При легкому болю вогник ледь видно, при сильному стіна вогню закриває клавіатуру й низ екрана.' },
    { id: 'black', name: 'Чорний вогонь', note: 'Тупий, важкий, повзе з кутів', fn: blackFlame,
      desc: '<b>Чорний вогонь.</b> Повільний темний біль: дрібне полум’я з рваними краями й клапті диму. При сильному повзе ще й з кутів, як важкість, що заповнює кадр.' },
    { id: 'spikes', name: 'Шпилі', note: 'Прострілює раптово й гостро', fn: spikes,
      desc: '<b>Шпилі.</b> Прострільний біль: гострі клини раптово вистрілюють знизу, а при сильному болю й збоку. Кадр смикається в момент удару, між ударами спокійно.' },
  ];

  // ---------- сцени ----------

  const scenes = [];
  function makeScene(canvas, variant) {
    const ctx = canvas.getContext('2d');
    return { canvas, ctx, variant, st: {}, img: ctx.createImageData(W, H) };
  }
  const big = makeScene(document.getElementById('big'), 0);
  const thumbs = document.getElementById('thumbs');
  VARIANTS.forEach((v, n) => {
    const b = document.createElement('button');
    b.className = 'thumb'; b.type = 'button'; b.id = 'v-' + v.id;
    b.innerHTML = `<canvas width="${W}" height="${H}"></canvas><span><kbd>${n + 1}</kbd> ${v.name}<small>${v.note}</small></span>`;
    b.onclick = () => select(n);
    thumbs.appendChild(b);
    scenes.push(makeScene(b.querySelector('canvas'), n));
  });

  let pain = 6, current = 0;
  const PROTO_VERSION = 2;
  try { const s = JSON.parse(localStorage.getItem('pain-proto') || '{}'); if (s.v != null && s.ver === PROTO_VERSION) current = s.v; if (s.p != null) pain = s.p; } catch (e) { /* без збереження */ }
  const slider = document.getElementById('pain'), stateEl = document.getElementById('state');
  slider.value = pain;
  function remember() { try { localStorage.setItem('pain-proto', JSON.stringify({ v: current, p: pain, ver: PROTO_VERSION })); } catch (e) { /* без збереження */ } }
  function setPain(p) {
    pain = Math.max(0, Math.min(10, p)); slider.value = pain;
    const st = pain <= 3 ? ['Легкий', 'var(--light)'] : pain <= 6 ? ['Помітний', 'var(--medium)'] : ['Сильний', 'var(--strong)'];
    stateEl.textContent = pain + ' · ' + st[0]; stateEl.style.setProperty('--c', st[1]);
    remember();
  }
  function select(n) {
    current = n; big.variant = n; big.st = {};
    document.getElementById('desc').innerHTML = VARIANTS[n].desc;
    thumbs.querySelectorAll('.thumb').forEach((b, k) => b.setAttribute('aria-pressed', String(k === n)));
    remember();
  }
  slider.addEventListener('input', () => setPain(Number(slider.value)));
  window.addEventListener('keydown', (e) => {
    if (/^Digit[1-8]$/.test(e.code)) select(Number(e.code.slice(5)) - 1);
    if (e.code === 'ArrowRight' || e.code === 'ArrowUp') { setPain(pain + 1); e.preventDefault(); }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowDown') { setPain(pain - 1); e.preventDefault(); }
  });
  setPain(pain); select(current);

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const t = now / 1000, i = pain / 10;
    for (const sc of [big, ...scenes]) {
      sc.img.data.set(BG.data);
      sc.st.dt = dt;
      VARIANTS[sc.variant].fn(sc.img.data, t, i, sc.st);
      const sh = sc.st.shake || 0;
      sc.ctx.fillStyle = '#1e2230'; sc.ctx.fillRect(0, 0, W, H);
      sc.ctx.putImageData(sc.img, sh ? (Math.random() < 0.5 ? -sh : sh) : 0, sh ? (Math.random() < 0.5 ? -1 : 1) : 0);
      if (sh) sc.st.shake = Math.max(0, sh - 1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
